name: multiplottr-local
services:
  web:
    build: .
    command: php -S 0.0.0.0:8080 -t /app /config/router.php
    volumes:
      - ./app:/app
      - ./router.php:/config/router.php:ro
      - ./maps-config.php:/config/maps-config.php:ro
      - ./local-membership.php:/config/local-membership.php:ro
      - ./config:/config/local:ro
    networks: [isolated]
    depends_on:
      db:
        condition: service_healthy
  gateway:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [entrance, isolated]
    depends_on: [web]
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: [REDACTED_CONFIG_VALUE]
      MARIADB_DATABASE: [REDACTED_CONFIG_VALUE]
      MARIADB_USER: [REDACTED_CONFIG_VALUE]
      MARIADB_PASSWORD: [REDACTED_CONFIG_VALUE]
    volumes:
      - database:/var/lib/mysql
      - ../private-backups:/backup:ro
    networks: [isolated]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 60
networks:
  entrance: {}
  isolated:
    internal: true
volumes:
  database:
